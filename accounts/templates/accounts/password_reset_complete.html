{% extends 'base.html' %}

{% block title %}
Password Reset Successful - ShopSphere
{% endblock %}

{% block content %}

<div class="success-container">

    <div class="success-card">

        <div class="success-icon">✅</div>

        <h1>Password Changed Successfully!</h1>

        <p>
            Your ShopSphere password has been reset.
            You can now log in using your new password.
        </p>

        <a href="{% url 'user_login' %}" class="login-button">
            Log In to ShopSphere
        </a>

    </div>

</div>


<style>

    .success-container {
        max-width: 520px;
        margin: 50px auto 60px;
    }

    .success-card {
        background: white;
        padding: 40px 30px;
        border-radius: 14px;
        text-align: center;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .success-icon {
        font-size: 60px;
        margin-bottom: 20px;
    }

    .success-card h1 {
        color: #198754;
        font-size: 27px;
        margin-bottom: 15px;
    }

    .success-card p {
        color: #6b7280;
        line-height: 1.7;
        margin-bottom: 25px;
    }

    .login-button {
        display: block;
        background: #007bff;
        color: white;
        text-decoration: none;
        font-weight: bold;
        padding: 13px;
        border-radius: 7px;
    }

    .login-button:hover {
        background: #0056b3;
    }

</style>

{% endblock %}
