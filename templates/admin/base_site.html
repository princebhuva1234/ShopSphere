
{% extends "admin/base.html" %}
{% load i18n %}

{% block branding %}
    {{ block.super }}

    <div id="shopsphere-dashboard-link">
        <a href="{% url 'admin_sales_dashboard' %}">
            📊 ShopSphere Sales Dashboard
        </a>
    </div>

    <style>
        #shopsphere-dashboard-link {
            display: inline-flex;
            align-items: center;
            margin-left: 20px;
            padding: 7px 12px;
            border: 1px solid #43b5a0;
            border-radius: 6px;
            background: #0f766e;
        }

        #shopsphere-dashboard-link a {
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        #shopsphere-dashboard-link a:hover {
            color: #d1fae5;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            #shopsphere-dashboard-link {
                margin-left: 8px;
                padding: 6px 8px;
            }

            #shopsphere-dashboard-link a {
                font-size: 11px;
            }
        }
    </style>
{% endblock %}
